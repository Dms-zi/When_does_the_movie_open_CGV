name: Check new CGV dates
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cgv-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Uijeongbu showtimes
        env:
          CGV_MONITOR_URL: ${{ vars.CGV_MONITOR_URL }}
          CGV_POLL_TOKEN: ${{ secrets.CGV_POLL_TOKEN }}
        run: |
          test -n "$CGV_MONITOR_URL" && test -n "$CGV_POLL_TOKEN"
          status=$(curl --silent --show-error --max-time 235 \
            --request POST --header "Authorization: Bearer $CGV_POLL_TOKEN" \
            --output check-result.json --write-out '%{http_code}' \
            "$CGV_MONITOR_URL/api/internal/poll")
          cat check-result.json
          if [ "$status" = 200 ]; then
            exit 0
          fi
          if [ "$status" = 503 ] && jq -e 'has("lastCheckedAt") and .error != null' check-result.json >/dev/null; then
            echo 'CGV check unavailable; status is shown on the website. No notification sent.'
            exit 0
          fi
          exit 1
